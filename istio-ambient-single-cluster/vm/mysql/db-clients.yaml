apiVersion: v1
kind: Namespace
metadata:
  name: db-clients
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api
  namespace: db-clients
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporting
  namespace: db-clients
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: db-clients
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      serviceAccountName: orders-api
      containers:
      - name: client
        image: mysql:8.4
        command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: db-clients
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting
  template:
    metadata:
      labels:
        app: reporting
    spec:
      serviceAccountName: reporting
      containers:
      - name: client
        image: mysql:8.4
        command: ["sleep", "infinity"]
