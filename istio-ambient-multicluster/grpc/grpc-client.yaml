# The same echo image, running its server entrypoint purely to stay alive. The traffic
# is generated by exec'ing the /usr/local/bin/client binary that ships in the image:
#
#   kubectl exec deploy/grpc-client -- /usr/local/bin/client --count 100 grpc://<host>:7070
#
# No Service is defined — nothing calls this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-client
spec:
  selector:
    matchLabels:
      app: grpc-client
  replicas: 1
  template:
    metadata:
      labels:
        app: grpc-client
    spec:
      containers:
      - name: grpc-client
        image: docker.io/istio/app:1.30.2@sha256:a72259de197c94697d15f0a87cffeadb31ad993dd9092f0b926099f4be01ca47
        imagePullPolicy: IfNotPresent
        args:
        - --port=8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
